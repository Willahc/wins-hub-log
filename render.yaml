services:
  - type: web
    name: wins-hub-log
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: wins-hub-log-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: wins-hub-log-db
    plan: free
